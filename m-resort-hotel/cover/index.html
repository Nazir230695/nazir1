<!DOCTYPE html>
<html lang="ms">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #000;
        --gold: #f5c542; --red: #fe2c55; --cyan: #25f4ee; --green: #22c55e;
        font-family: "Montserrat", sans-serif; color: #fff; }
      #bg { position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; }
      .shade { position: absolute; inset: 0; background:
        linear-gradient(180deg, rgba(0,0,0,.55) 0%, rgba(0,0,0,.15) 30%, rgba(0,0,0,0) 45%, rgba(0,0,0,.0) 60%, rgba(0,0,0,.6) 100%); }
      .hdr { position: absolute; left: 60px; width: 960px; top: 214px; display: flex; align-items: center; gap: 22px;
        padding: 16px 30px 16px 20px; border-radius: 30px; background: rgba(14,15,19,.82); border: 1.5px solid rgba(255,255,255,.16); font-weight: 800; }
      .hdr svg { width: 42px; height: 42px; flex: none; }
      .tr { display: flex; align-items: center; gap: 10px; font-size: 30px; letter-spacing: .1em; }
      .u { margin: 4px 0 0 52px; font-size: 28px; font-weight: 700; color: var(--cyan); }
      .sep { width: 2px; align-self: stretch; background: rgba(255,255,255,.22); }
      .r { flex: 1; text-align: right; } .h { font-size: 34px; white-space: nowrap; }
      .c { margin-top: 4px; font-size: 28px; font-weight: 600; color: rgba(255,255,255,.75); } .st { color: var(--gold); }
      .hook { position: absolute; left: 0; width: 1080px; top: 600px; text-align: center; font-family: "Oswald", sans-serif; font-weight: 700;
        text-shadow: 0 5px 0 rgba(0,0,0,.35), 0 12px 44px rgba(0,0,0,.8); line-height: .98; }
      .l1 { font-size: 190px; } .l1 span { color: var(--gold); }
      .l2 { font-size: 140px; margin-top: 52px; }
      .l2 span { background: var(--red); padding: 0 24px; border-radius: 24px; text-shadow: none; }
      .sub { position: absolute; left: 0; width: 1080px; top: 1110px; text-align: center; }
      .pill { display: inline-flex; align-items: center; gap: 14px; padding: 18px 36px; border-radius: 999px; background: #fff; color: #111;
        font-weight: 800; font-size: 46px; box-shadow: -6px 0 0 var(--cyan), 6px 0 0 var(--red), 0 14px 34px rgba(0,0,0,.45); }
      .dot { width: 22px; height: 22px; border-radius: 50%; background: var(--red); box-shadow: -5px 0 0 var(--cyan); }
      .five { position: absolute; left: 0; width: 1080px; top: 395px; text-align: center; }
      .five .bx { display: inline-block; padding: 18px 44px 20px; border-radius: 28px; background: rgba(14,15,19,.8); border: 2px solid rgba(245,197,66,.7); box-shadow: 0 14px 34px rgba(0,0,0,.45); }
      .five .stars { display: flex; justify-content: center; gap: 10px; } .five svg { width: 62px; height: 62px; }
      .five .t { margin-top: 8px; font-weight: 800; font-size: 50px; letter-spacing: .14em; color: var(--gold); }
      .tags { position: absolute; left: 0; width: 1080px; top: 1400px; display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; padding: 0 90px; }
      .tag { padding: 14px 26px; border-radius: 999px; background: rgba(14,15,19,.78); border: 1.5px solid rgba(255,255,255,.18); font-weight: 700; font-size: 34px; }
      .tag b { color: var(--gold); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="1" data-width="1080" data-height="1920">
      <img id="bg" class="clip" src="assets/bg.jpg" alt="" data-start="0" data-duration="1" data-track-index="0">
      <div class="shade clip" data-start="0" data-duration="1" data-track-index="1"></div>
      <div class="hdr clip" data-start="0" data-duration="1" data-track-index="2" data-layout-allow-safe-zone>
        <div><div class="tr"><svg viewBox="0 0 24 24"><path d="M12 1.8l2.6 1.9 3.2-.1 1 3.1 2.6 1.9-1 3.1 1 3.1-2.6 1.9-1 3.1-3.2-.1L12 22.2l-2.6-1.9-3.2.1-1-3.1-2.6-1.9 1-3.1-1-3.1 2.6-1.9 1-3.1 3.2.1z" fill="#20d5ec"/><path d="M7.6 12.3l3 3 5.8-6" stroke="#0b0b0f" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span>TRUSTED REVIEW</span></div><div class="u">@rezeki.nazir</div></div>
        <div class="sep"></div>
        <div class="r"><div class="h">M Resort &amp; Hotel</div><div class="c">Kuala Lumpur <span class="st">★</span> 4.9</div></div>
      </div>
      <div class="five clip" data-start="0" data-duration="1" data-track-index="6"><div class="bx"><div class="stars"><svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z" fill="#f5c542"/></svg><svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z" fill="#f5c542"/></svg><svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z" fill="#f5c542"/></svg><svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z" fill="#f5c542"/></svg><svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z" fill="#f5c542"/></svg></div><div class="t">HOTEL 5 BINTANG</div></div></div>
      <div class="hook clip" data-start="0" data-duration="1" data-track-index="3">
        <div class="l1">HOTEL <span>T20</span></div>
        <div class="l2">HARGA <span>B40</span></div>
      </div>
      <div class="sub clip" data-start="0" data-duration="1" data-track-index="4"><span class="pill"><span class="dot"></span>booking di TikTok</span></div>
      <div class="tags clip" data-start="0" data-duration="1" data-track-index="5">
        <span class="tag">Bukit Kiara, KL</span><span class="tag">Kolam ala resort</span><span class="tag">Breakfast buffet</span><span class="tag">Kids club</span>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.to({}, { duration: 1 }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
